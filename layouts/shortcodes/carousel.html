<div id="carousel{{ .Ordinal }}" class="carousel" duration="{{ .Get `duration` }}">
  <ul>
    {{ range $index, $slide := hugo.Data.carousel.images }}
      <li id="c{{ $.Ordinal }}_slide{{ add $index 1 }}" style="min-width: calc(75% / 1); padding-bottom: 300px;">
        <img src="{{ $slide.image }}" alt="" style="width: 100%; height: 100%; object-fit: contain;">
        <div>
          <div>{{ $slide.content_html }}</div>
        </div>
      </li>
    {{ end }}
  </ul>
  <ol>
    {{ range $index, $page := hugo.Data.carousel.images }}
      <li>
        <a href="#c{{ $.Ordinal }}_slide{{ add $index 1 }}"></a>
      </li>
    {{ end }}
  </ol>
  <div class="prev">&lsaquo;</div>
  <div class="next">&rsaquo;</div>
</div>
